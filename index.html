<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NMS 太空船數據終端機 (Space HUD Terminal)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="hud-container">
    <!-- 頂部 HUD 標頭 -->
    <header class="hud-header">
      <div class="brand">
        <span class="hud-pulse"></span>
        <h1>NMS // TERMINAL v2.5</h1>
      </div>
      <nav class="hud-tabs">
        <button class="tab-btn active" data-tab="trading">📈 貿易星系網絡</button>
        <button class="tab-btn" data-tab="data">🪐 勘探生態圖鑑</button>
        <button class="tab-btn" data-tab="money">💰 商業資產帳本</button>
      </nav>
      <button id="sync-btn" class="hud-btn glow">🔄 雲端同步</button>
    </header>

    <!-- 主工作區域：兩欄式（左列表/右詳細資訊） -->
    <main class="hud-body">
      <!-- 左側：搜尋與列表 -->
      <section class="panel-left">
        <div class="controls-bar">
          <input type="text" id="search-input" placeholder="🔍 搜尋星系/星球/資源..." />
          <button id="add-btn" class="hud-btn success">+ 新增資料</button>
        </div>
        <div id="item-list" class="hud-list">
          <!-- 動態渲染列表內容 -->
        </div>
      </section>

      <!-- 右側：詳細資訊展報 (Detail View) -->
      <section class="panel-right">
        <div id="detail-view" class="hud-card detail-card">
          <div class="empty-state">請選擇左側項目以檢視詳細數據數據鏈</div>
        </div>
      </section>
    </main>
  </div>

  <!-- Modal 彈窗：新增數據 -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="hud-card modal-card">
      <div class="modal-header">
        <h3 id="modal-title">新增資料</h3>
        <button id="modal-close" class="close-btn">&times;</button>
      </div>
      <form id="hud-form">
        <div id="form-fields"></div>
        <div class="modal-footer">
          <button type="submit" class="hud-btn success">確認提交</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 引入 JS 模組 -->
  <script src="js/logic.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
