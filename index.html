<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Man's Sky 資訊終端 | INFINITE TREE OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="view.css">
</head>
<body>
    <div class="hud-container">
        <header class="hud-header">
            <div class="hud-logo">無人深空 資訊終端</div>
            <div class="hud-actions">
                <button class="hud-btn" id="btn-toggle-mode">👁️ 切換顯示模式</button>
                <button class="hud-btn primary" id="btn-sync-cloud" style="display: block;">☁️ SYNC TO CLOUD</button>
                <span class="hud-status">SYS_STATUS: <span id="sys-status" class="status-ok">DB_OFFLINE</span></span>
            </div>
        </header>

        <!-- 編輯模式區塊 (原有) -->
        <main class="hud-layout" id="edit-mode-container">
            <aside class="sidebar">
                <div class="panel-title">[ DATA_TREE ]</div>
                <div class="search-box">
                    <input type="text" id="search-input" class="hud-input" placeholder="SEARCH NODES...">
                </div>
                <div class="tree-toolbar">
                    <button class="hud-btn small" id="btn-add-galaxy">+ 星系</button>
                    <button class="hud-btn small" id="btn-add-planet">+ 星球</button>
                    <button class="hud-btn small" id="btn-add-landmark">+ 標點</button>
                    <button class="hud-btn small danger" id="btn-delete-node">🗑 DELETE</button>
                </div>
                <div class="tree-container" id="tree-root">
                    <div style="text-align:center; color: var(--text-muted); margin-top: 20px;">[ INITIALIZING... ]</div>
                </div>
            </aside>
            <section class="detail-panel">
                <div class="panel-title">[ NODE_EDITOR ]</div>
                <div class="data-display" id="data-display">
                    <div style="text-align:center; color: var(--text-muted); margin-top: 50px;">NO NODE SELECTED</div>
                </div>
                <div class="hud-corner top-right"></div>
                <div class="hud-corner bottom-right"></div>
            </section>
        </main>

        <!-- 顯示模式區塊 (新增) -->
        <main class="view-layout hidden" id="view-mode-container">
            <div class="view-toolbar">
                <button class="hud-btn small" id="btn-view-back" style="display: none;">◂ 返回上層</button>
                <div class="view-path" id="view-path-display">[ 宇宙全覽 ]</div>
                <div class="search-box" style="margin-bottom: 0;">
                    <input type="text" class="hud-input" placeholder="SEARCH DATABASE...">
                </div>
            </div>
            
            <!-- 上方資訊區 -->
            <div class="view-info-panel" id="view-info-panel" style="display: none;"></div>
            
            <!-- 下方互動區 -->
            <div class="view-content-area" id="view-content-area">
                <!-- 列表或星球 3D 將動態注入於此 -->
            </div>
            
            <div class="hud-corner top-right"></div>
            <div class="hud-corner bottom-right"></div>
        </main>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
