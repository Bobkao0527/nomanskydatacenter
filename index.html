<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NMS ATLAS TERMINAL</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- Three.js 3D 渲染引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div class="hud-container">
        <header class="hud-header">
            <div class="logo">
                <span class="icon">♦</span>
                <h1>NMS ATLAS_OS // v1.0.5</h1>
            </div>
            <div class="status-panel">
                <span id="connection-status" class="status-indicator">STATUS: WAITING</span>
                <button class="hud-btn" onclick="app.fetchData()">[ INITIALIZE / LOAD ]</button>
                <button class="hud-btn highlight" onclick="app.saveData()">[ UPLOAD DATA ]</button>
            </div>
        </header>

        <main class="hud-main">
            <aside class="hud-sidebar">
                <div class="sidebar-header">
                    <h2>> SYSTEM_INDEX</h2>
                </div>
                <ul id="system-list" class="system-list">
                    <!-- JS injected -->
                </ul>
                <button class="hud-btn add-btn" onclick="app.promptAddSystem()">+ NEW_SYSTEM</button>
            </aside>

            <section class="hud-content" id="main-content">
                <div class="init-screen">
                    <div class="glitch-text" data-text="SELECT SYSTEM TO BEGIN">SELECT SYSTEM TO BEGIN</div>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
